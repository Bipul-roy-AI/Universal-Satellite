[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-satellite"
version = "0.2.0"
description = "Historical-to-current Earth observation discovery, downloads and GIS workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
raster = ["numpy>=1.24,<3", "rasterio>=1.3,<2"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
universal-satellite = "universal_satellite.cli:main"

[tool.setuptools.packages.find]
include = ["universal_satellite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
