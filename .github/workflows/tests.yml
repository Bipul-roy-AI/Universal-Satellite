name: tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -e ".[raster,dev]"
      - run: python -m pytest -q
      - run: node --test javascript/test/client.test.js
      - run: python -m build
      - run: python tools/package_indices.py
      - run: python tools/package_qgis.py
      - run: python tools/package_arcgis.py
      - run: npm pack ./javascript --dry-run
